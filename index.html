<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu Presente Está Pronto</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #05060a;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    background: radial-gradient(circle at 50% 30%, #1a1330 0%, #0a0a14 45%, #050508 100%);
  }

  /* animated glow backdrop */
  .glow-orb {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,60,0.25) 0%, rgba(255,200,60,0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    animation: orbPulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes orbPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(0.9); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
  }

  /* subtle floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 215, 130, 0.55);
    pointer-events: none;
    filter: blur(0.5px);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-120vh) translateX(20px); opacity: 0; }
  }

  .top-label {
    position: relative;
    z-index: 3;
    color: #f4e3b2;
    letter-spacing: 3px;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 18px;
    text-shadow: 0 0 12px rgba(255,215,130,0.5);
    text-align: center;
    animation: fadeIn 1s ease both;
  }

  .finger {
    position: relative;
    z-index: 3;
    font-size: 56px;
    animation: pointBounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255, 200, 90, 0.7));
    margin-bottom: -6px;
  }

  @keyframes pointBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(18px); }
  }

  .gift-wrap {
    position: relative;
    z-index: 3;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }

  .gift-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(255, 205, 100, 0.35);
    animation: ringPulse 2.2s ease-out infinite;
  }

  .gift-ring.delay {
    animation-delay: 1.1s;
  }

  @keyframes ringPulse {
    0% { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .gift-box {
    font-size: 130px;
    animation: giftFloat 2.4s ease-in-out infinite, giftGlow 2s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255, 190, 70, 0.65));
  }

  @keyframes giftFloat {
    0%, 100% { transform: translateY(0) scale(1) rotate(-2deg); }
    50% { transform: translateY(-14px) scale(1.05) rotate(2deg); }
  }

  @keyframes giftGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 190, 70, 0.45)); }
    50% { filter: drop-shadow(0 0 45px rgba(255, 210, 100, 0.9)); }
  }

  .cta-text {
    position: relative;
    z-index: 3;
    margin-top: 26px;
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    padding: 0 30px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    animation: fadeIn 1.2s ease both;
  }

  .cta-sub {
    position: relative;
    z-index: 3;
    margin-top: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    padding: 0 40px;
    animation: fadeIn 1.4s ease both;
  }

  .cta-button {
    position: relative;
    z-index: 3;
    margin-top: 28px;
    padding: 16px 42px;
    background: linear-gradient(135deg, #ffd76a, #f6a93b);
    color: #201400;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(246, 169, 59, 0.45), inset 0 1px 0 rgba(255,255,255,0.6);
    animation: buttonPulse 1.8s ease-in-out infinite, fadeIn 1.6s ease both;
    text-transform: uppercase;
  }

  @keyframes buttonPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(246, 169, 59, 0.45), inset 0 1px 0 rgba(255,255,255,0.6); transform: scale(1); }
    50% { box-shadow: 0 10px 34px rgba(246, 169, 59, 0.75), inset 0 1px 0 rgba(255,255,255,0.6); transform: scale(1.04); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
  }

  .flash.active {
    animation: flashOut 0.4s ease forwards;
  }

  @keyframes flashOut {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }
</style>
</head>
<body id="page">

  <div class="glow-orb"></div>

  <div class="top-label">Clique aqui</div>

  <div class="finger">👇</div>

  <div class="gift-wrap">
    <div class="gift-ring"></div>
    <div class="gift-ring delay"></div>
    <div class="gift-box">🎁</div>
  </div>

  <div class="flash" id="flash"></div>

<script>
  const REDIRECT_URL = "https://t.me/BellaSouza19";

  // floating particles
  const body = document.getElementById('page');
  const colors = ['rgba(255,215,130,0.55)', 'rgba(255,180,80,0.4)', 'rgba(255,240,200,0.5)'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = -(Math.random() * 20) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 6) + 's';
    body.appendChild(p);
  }

  let redirected = false;
  function goToOffer() {
    if (redirected) return;
    redirected = true;
    const flash = document.getElementById('flash');
    flash.classList.add('active');
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 220);
  }

  document.body.addEventListener('click', goToOffer);
  document.body.addEventListener('touchend', function(e){
    e.preventDefault();
    goToOffer();
  }, { passive: false });
</script>

</body>
</html>
