<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Seu Presente Está Pronto</title>
<!-- MELO · Script de UTMs: registra de qual anúncio veio o clique e leva as UTMs para a página de vendas.
     Sem data-redirect: a pessoa só vai para a oferta depois de tocar no presente. -->
<script src="https://melo-production-eb36.up.railway.app/u.js" data-destino="https://familiasac4na.vercel.app/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1a1330 0%, #0a0a14 45%, #050508 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* A tela inteira é o botão (um link de verdade: funciona até sem JavaScript). */
  .offer {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  .glow-orb {
    position: absolute;
    top: 50%; left: 50%;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 200, 60, 0.25) 0%, rgba(255, 200, 60, 0) 70%);
    transform: translate(-50%, -50%);
    animation: orbPulse 3.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes orbPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  .particle {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    10%, 90% { opacity: 1; }
    100% { transform: translate(20px, -120vh); opacity: 0; }
  }

  .top-label {
    position: relative;
    z-index: 2;
    margin-bottom: 18px;
    color: #f4e3b2;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255, 215, 130, 0.5);
    animation: fadeIn 1s ease both;
  }

  .finger {
    position: relative;
    z-index: 2;
    margin-bottom: -6px;
    font-size: 56px;
    line-height: 1;
    filter: drop-shadow(0 0 18px rgba(255, 200, 90, 0.7));
    animation: pointBounce 1.4s ease-in-out infinite;
  }
  @keyframes pointBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(18px); } }

  .gift-wrap {
    position: relative;
    z-index: 2;
    width: 220px; height: 220px;
    margin-top: 10px;
    display: grid;
    place-items: center;
  }
  .gift-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255, 205, 100, 0.35);
    animation: ringPulse 2.2s ease-out infinite;
  }
  .gift-ring.delay { animation-delay: 1.1s; }
  @keyframes ringPulse { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }

  .gift-box {
    font-size: 130px;
    line-height: 1;
    animation: giftFloat 2.4s ease-in-out infinite, giftGlow 2s ease-in-out infinite;
  }
  @keyframes giftFloat {
    0%, 100% { transform: translateY(0) scale(1) rotate(-2deg); }
    50% { transform: translateY(-14px) scale(1.05) rotate(2deg); }
  }
  @keyframes giftGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 190, 70, 0.45)); }
    50% { filter: drop-shadow(0 0 45px rgba(255, 210, 100, 0.9)); }
  }

  .offer:active .gift-box { transform: scale(0.94); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  .flash.active { animation: flashOut 0.4s ease forwards; }
  @keyframes flashOut { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>

  <a class="offer" id="offer" href="https://t.me/BellaSouza19" aria-label="Abrir meu presente">
    <span class="glow-orb" aria-hidden="true"></span>
    <span class="top-label">Clique aqui</span>
    <span class="finger" aria-hidden="true">👇</span>
    <span class="gift-wrap" aria-hidden="true">
      <span class="gift-ring"></span>
      <span class="gift-ring delay"></span>
      <span class="gift-box">🎁</span>
    </span>
  </a>

  <div class="flash" id="flash" aria-hidden="true"></div>

<script>
  (function () {
    var DESTINO = 'https://t.me/BellaSouza19';
    var offer = document.getElementById('offer');
    var flash = document.getElementById('flash');
    var indo = false;

    // Partículas douradas subindo.
    var cores = ['rgba(255,215,130,0.55)', 'rgba(255,180,80,0.4)', 'rgba(255,240,200,0.5)'];
    for (var i = 0; i < 22; i++) {
      var p = document.createElement('span');
      var t = 2 + Math.random() * 4;
      p.className = 'particle';
      p.setAttribute('aria-hidden', 'true');
      p.style.width = t + 'px';
      p.style.height = t + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = cores[Math.floor(Math.random() * cores.length)];
      p.style.animationDuration = 6 + Math.random() * 6 + 's';
      p.style.animationDelay = Math.random() * 6 + 's';
      offer.appendChild(p);
    }

    // Link final: com o MELO carregado, leva as UTMs do anúncio + o código do clique.
    function destino() {
      return window.MELO_UTM ? window.MELO_UTM.link(DESTINO) : DESTINO;
    }

    // Um único toque/clique (sem disparar duas vezes no celular): flash e vai para a oferta.
    offer.addEventListener('click', function (e) {
      e.preventDefault();
      if (indo) return;
      indo = true;
      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');
      var url = destino();
      setTimeout(function () { window.location.href = url; }, 220);
    });

    // Voltou pelo botão "voltar" do navegador: libera o clique de novo.
    window.addEventListener('pageshow', function () { indo = false; flash.classList.remove('active'); });
  })();
</script>

</body>
</html>
